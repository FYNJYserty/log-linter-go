name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.22, 1.25]

    steps:
      - name: Print Go version
        run: go version

      - name: Run unit tests in root module
        run: |
          go test -v ./...
      
      - name: Build binary file for release
        run: |
          go build -o ./build/mylinter ./cmd/main.go

      - name: Build plugin
        run: |
          cd plugin
          go build -buildmode=plugin -o loglinter.so ./...
